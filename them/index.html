<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pallete Color Theme</title>
  
  <!-- Font Blazed (Rubik Burned) & Teks UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Rubik+Burned&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="container">
    <header class="header">
      <h1 class="theme-title">THEME COLOR</h1>
      <p class="subtitle">Compact Embossed Dynamic Color Palette</p>
    </header>

    <section class="palette-grid" id="paletteGrid">
      <!-- Di-generate otomatis oleh script.js -->
    </section>
  </main>

  <!-- Toast Notifikasi Salin -->
  <div class="toast" id="toast">
    <div class="toast-dot" id="toastDot"></div>
    <span id="toastMsg">Kode warna berhasil disalin!</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
